[platformio]
extra_configs = platformio.ini

[env:artoria-pressure]
extends = env:esp32-s3-devkitc-1
extra_scripts = pre:tests/hardware/probe_build.py
custom_hw_probe = pressure

[env:sprout-pressure]
extends = env:sprout-ssd1351
extra_scripts = pre:tests/hardware/probe_build.py
custom_hw_probe = pressure

[env:artoria-offline]
extends = env:esp32-s3-devkitc-1
extra_scripts = pre:tests/hardware/probe_build.py
custom_hw_probe = offline

[env:sprout-offline]
extends = env:sprout-ssd1351
extra_scripts = pre:tests/hardware/probe_build.py
custom_hw_probe = offline
