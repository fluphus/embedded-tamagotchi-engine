[platformio]
default_envs = esp32-s3-devkitc-1

; PlatformIO Project Configuration File
; Artoria Tamagotchi - ESP32-S3 N16R8
; Display: SSD1351 1.5" 128x128 65K Color OLED

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
    -DUSER_SETUP_LOADED=1
    -DSSD1351_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=128
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=20000000
build_unflags = -std=gnu++11
; Asset conversion: run manually with the correct Python:
;   python tools/convert_assets.py
; Disabled auto-run because PlatformIO's Python may lack Pillow
; extra_scripts = pre:tools/pre_build_assets.py
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit SSD1351 library@1.3.3

; Same engine/application, selected package and display adapter at compile time.
[env:artoria-serial]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DDISPLAY_BACKEND_SERIAL_PLACEHOLDER=1

[env:sprout-ssd1351]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DCONTENT_SPROUT=1

[env:sprout-serial]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DCONTENT_SPROUT=1 -DDISPLAY_BACKEND_SERIAL_PLACEHOLDER=1
